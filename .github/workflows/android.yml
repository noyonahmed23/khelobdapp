name: Android CI
on:
push:
branches:
- main
- master
pull_request:
branches:
- main
- master

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

```
  - name: Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "9.3.1"

  - name: Create default secrets file
    run: echo "# CI fallback" > local.defaults.properties

  - name: Build User
    run: gradle :app:assembleUserDebug --no-daemon --stacktrace

  - name: Build Admin
    run: gradle :app:assembleAdminDebug --no-daemon --stacktrace

  - name: Upload APKs
    uses: actions/upload-artifact@v4
    with:
      name: khelo-bd-apks
      path: |
        app/build/outputs/apk/user/debug/*.apk
        app/build/outputs/apk/admin/debug/*.apk
      if-no-files-found: error
```
