name: Android CI

on:
push:
branches:
- main
- master

pull_request:
branches:
- main
- master

jobs:
build:
name: Build Android APKs
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"
      cache: gradle

  - name: Set up Gradle 9.3.1
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "9.3.1"

  - name: Verify project files
    shell: bash
    run: |
      echo "Project root:"
      pwd
      echo
      echo "Gradle files:"
      ls -la
      echo
      echo "Workflow:"
      test -f .github/workflows/android.yml
      echo "android.yml exists"
      echo
      echo "Default secrets file:"
      if [ ! -f local.defaults.properties ]; then
        printf '%s\n' '# Safe CI fallback properties' > local.defaults.properties
        echo "Created local.defaults.properties"
      else
        echo "local.defaults.properties already exists"
      fi

  - name: Build User Debug APK
    run: |
      gradle :app:assembleUserDebug \
        --no-daemon \
        --stacktrace

  - name: Build Admin Debug APK
    run: |
      gradle :app:assembleAdminDebug \
        --no-daemon \
        --stacktrace

  - name: Show generated APKs
    shell: bash
    run: |
      echo "Generated APK files:"
      find app/build/outputs/apk -type f -name "*.apk" -print

  - name: Upload User Debug APK
    uses: actions/upload-artifact@v4
    with:
      name: khelo-bd-user-debug
      path: app/build/outputs/apk/user/debug/*.apk
      if-no-files-found: error
      retention-days: 7

  - name: Upload Admin Debug APK
    uses: actions/upload-artifact@v4
    with:
      name: khelo-bd-admin-debug
      path: app/build/outputs/apk/admin/debug/*.apk
      if-no-files-found: error
      retention-days: 7
```
