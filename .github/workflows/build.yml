name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Fresh Gradle 9.3.1 Wrapper
      run: |
        sudo apt-get update
        sudo apt-get install -y gradle
        rm -rf gradlew gradlew.bat gradle/ app/gradle/
        gradle wrapper --gradle-version 9.3.1
        chmod +x gradlew

    - name: Fix Kotlin DSL build.gradle.kts variant error automatically
      run: |
        python3 -c '
        path = "app/build.gradle.kts"
        try:
            with open(path, "r") as f:
                lines = f.readlines()
            new_lines = []
            skip = False
            brace_count = 0
            for line in lines:
                if "applicationVariants" in line or "productFlavors" in line:
                    skip = True
                    brace_count = line.count("{") - line.count("}")
                    if brace_count <= 0:
                        skip = False
                    continue
                if skip:
                    brace_count += line.count("{") - line.count("}")
                    if brace_count <= 0:
                        skip = False
                    continue
                new_lines.append(line)
            with open(path, "w") as f:
                f.writelines(new_lines)
            print("Successfully patched build.gradle.kts")
        except Exception as e:
            print("Skipped patching:", e)
        '

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
